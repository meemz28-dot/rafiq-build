name: Build APK
on:
  push:
    paths: ['**.zip']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'   # the legacy 'tools' package no longer exists on current runners

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unzip project
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then echo "::error::No .zip in repo root."; exit 1; fi
          echo "Building from: $ZIP"
          unzip -q "$ZIP"

      - name: Build debug APK
        working-directory: android
        run: |
          gradle --version
          set +e
          gradle assembleDebug --console=plain --stacktrace > build.log 2>&1
          echo "EXIT=$?"
          echo "===== ERRORS ====="
          grep -n "^e: \|FAILURE\|Caused by\|error:" build.log | tail -30
          echo "===== LAST 40 LINES ====="
          tail -40 build.log
          echo "===== APK ====="
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "no apk dir"
          exit 0

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            android/build.log
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
