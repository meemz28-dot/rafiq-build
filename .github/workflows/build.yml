name: Build APK
on:
  push:
    paths: ['**.zip']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify compiler present
        run: java -version && javac -version

      - uses: android-actions/setup-android@v3

      - name: Unzip project
        run: |
          ls -la
          ZIP=$(ls *.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then
            echo "::error::No .zip found in repo root. Upload DuaaWaZiyara-android.zip first."
            exit 1
          fi
          echo "Building from: $ZIP"
          unzip -q "$ZIP"

      - name: Restore Gradle wrapper jar
        working-directory: android
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p /tmp/w
            cd /tmp/w
            touch settings.gradle.kts
            gradle wrapper --gradle-version 8.11.1
            cp /tmp/w/gradle/wrapper/gradle-wrapper.jar "$GITHUB_WORKSPACE/android/gradle/wrapper/"
            ls -la "$GITHUB_WORKSPACE/android/gradle/wrapper/"
          fi
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew compileDebugKotlin --console=plain --stacktrace --no-daemon > build.log 2>&1
          echo "exit=$?"
          echo "===== ERROR LINES ====="
          grep -n "^e: \|^w: \|FAILURE\|Caused by\|Exception\|error:\|OutOfMemory\|Daemon" build.log | head -60
          echo "===== LAST 120 LINES ====="
          tail -120 build.log
          exit 0

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android/build.log
