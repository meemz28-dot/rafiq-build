name: Build APK from Zip
on:
  push:
    paths: ['**.zip']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Unzip project
        run: |
          ls -la
          ZIP=$(ls *.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then
            echo "::error::No .zip in repo root. Upload DuaaWaZiyara-android.zip first."
            exit 1
          fi
          echo "Building from: $ZIP"
          unzip -q "$ZIP"
      - name: Wrapper jar (if missing)
        working-directory: android
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
      - name: Build
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
