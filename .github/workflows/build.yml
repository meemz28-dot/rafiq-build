name: Build APK
on:
  push:
    paths: ['**.zip']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'   # the legacy 'tools' package no longer exists on current runners

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unzip project
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then echo "::error::No .zip in repo root."; exit 1; fi
          echo "Building from: $ZIP"
          unzip -q "$ZIP"

      - name: Build debug APK
        working-directory: android
        run: |
          gradle --version
          set +e
          gradle assembleDebug --console=plain --stacktrace > build.log 2>&1
          echo "EXIT=$?"
          echo "===== ERRORS ====="
          grep -n "^e: \|FAILURE\|Caused by\|error:" build.log | tail -30
          echo "===== LAST 40 LINES ====="
          tail -40 build.log
          echo "===== APK ====="
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "no apk dir"
          exit 0

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            android/build.log
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Publish APK to the apk-out branch (easy to fetch with git)
        if: hashFiles('android/app/build/outputs/apk/debug/app-debug.apk') != ''
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/rafiq-debug.apk
          git clone -q --depth 1 -b apk-out "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" /tmp/out || (mkdir /tmp/out && cd /tmp/out && git init -q -b apk-out)
          cd /tmp/out && cp /tmp/rafiq-debug.apk .
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add rafiq-debug.apk && git commit -q -m "Debug APK from ${GITHUB_SHA::7}"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" apk-out

  screens:
    # Captures every page of the debug build on an emulator, for design review. Pushed to apk-out/screens.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Fetch the APK
        run: git clone -q --depth 1 -b apk-out "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" out
      - name: Write capture script
        run: |
          cat > shots.sh <<'SH'
          set -x
          adb install -r out/rafiq-debug.apk
          mkdir -p shots
          adb shell pm grant com.shirazi.duaa.debug android.permission.POST_NOTIFICATIONS || true
          adb shell pm grant com.shirazi.duaa.debug android.permission.ACCESS_FINE_LOCATION || true
          shot() { n=$1; th=$2; shift 2
            adb shell am force-stop com.shirazi.duaa.debug
            adb shell am start -W -n com.shirazi.duaa.debug/com.shirazi.duaa.MainActivity --ez skip_onboarding true --es theme $th "$@" >/dev/null
            sleep 6; adb exec-out screencap -p > shots/$n.png; }
          for t in home lib prayer cal more; do shot tab-$t light --es tab $t; done
          for s in khira weekly asma masoom khums tracker layl hajj ashura qibla muhasaba journey trait amaal qada khatma converter ptable qpoints; do shot screen-$s light --es screen $s; done
          for s in tasbih fav settings about; do shot sheet-$s light --es sheet $s; done
          shot reader-kumayl light --es reader mashhura/m-kumayl
          shot reader-quran light --es reader quran/q-001
          shot reader-kafi light --es reader kafi-dua/kf2-1
          shot dark-home dark --es tab home
          shot dark-khira dark --es screen khira
          shot dark-reader dark --es reader mashhura/m-kumayl
          shot dark-lib dark --es tab lib
          ls -la shots
          adb logcat -d | grep -E "FATAL|AndroidRuntime" | head -40 || true
          SH
      - name: Capture pages
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: bash shots.sh
      - name: Publish screenshots to apk-out
        run: |
          cd out && mkdir -p screens && cp ../shots/*.png screens/
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add screens && git commit -q -m "Page screenshots ${GITHUB_SHA::7}"
          for i in 1 2 3; do git pull -q --rebase origin apk-out && git push -q origin apk-out && break; sleep 5; done
