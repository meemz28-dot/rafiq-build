# Builds an unsigned iPhone .ipa from the same zip, for sideloading with Sideloadly (it signs with your Apple ID).
# The .ipa is pushed to the apk-out branch as RafiqAlMumin.ipa.
name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    paths: ['**.zip']

jobs:
  ipa:
    runs-on: macos-26   # Xcode 26 / iOS 26 SDK: required for Liquid Glass
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q "$(ls *.zip | head -1)"

      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode_26*.app || true
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1); sudo xcode-select -s "$X/Contents/Developer"; xcodebuild -version

      - name: Generate the Xcode project
        working-directory: android/ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        working-directory: android/ios
        run: |
          set -o pipefail
          xcodebuild -project RafiqAlMumin.xcodeproj -scheme RafiqAlMumin -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee xcodebuild.log | grep -E "error:|warning: unre|BUILD" | head -150

      - name: Package .ipa
        working-directory: android/ios
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP" || { echo "::error::No .app produced"; exit 1; }
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry RafiqAlMumin.ipa Payload && ls -la RafiqAlMumin.ipa

      - name: Publish .ipa to apk-out
        run: |
          git clone -q --depth 1 -b apk-out "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" out || { mkdir out && cd out && git init -q -b apk-out && cd ..; }
          cp android/ios/RafiqAlMumin.ipa out/
          cd out && git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add RafiqAlMumin.ipa && git commit -q -m "iOS ipa ${GITHUB_SHA::7}"
          for i in 1 2 3; do git pull -q --rebase origin apk-out; git push -q origin apk-out && break; sleep 8; done

      - name: Simulator screenshots (iOS 26)
        working-directory: android/ios
        run: |
          set -x
          xcodebuild -project RafiqAlMumin.xcodeproj -scheme RafiqAlMumin -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|BUILD" | head -40
          APP=$(find simbuild/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[(k,x) for k,v in d.items() if 'iOS-26' in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']]; print(sorted(c)[-1][1]['udid'] if c else '')")
          test -n "$UDID" || UDID=$(xcrun simctl list devices available | grep -m1 -oE "iPhone [^(]+\(([0-9A-F-]{36})\)" | grep -oE "[0-9A-F-]{36}")
          xcrun simctl boot "$UDID" || true; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          shot() { n=$1; shift; xcrun simctl terminate "$UDID" com.shirazi.rafiq 2>/dev/null; xcrun simctl launch "$UDID" com.shirazi.rafiq -onboarded YES "$@" >/dev/null; sleep 5; xcrun simctl io "$UDID" screenshot "shots/$n.png" >/dev/null 2>&1 || echo "no shot $n"; }
          xcrun simctl launch "$UDID" com.shirazi.rafiq >/dev/null; sleep 5; xcrun simctl io "$UDID" screenshot shots/onboarding.png
          for t in home library prayer calendar more; do shot tab-$t -debugTab $t; done
          for t in khira weekly asma masoom khums tracker layl hajj ashura qibla muhasaba journey trait amaal qada khatma converter ptable qpoints shrine listen; do shot tool-$t -debugTool $t; done
          for t in tasbih favorites bookmarks settings about location method; do shot sheet-$t -debugSheet $t; done
          shot reader-kumayl -debugReader mashhura/m-kumayl
          shot reader-quran -debugReader quran/q-001
          shot category-sahifa -debugCategory sahifa
          shot listen-dua -debugListen "دعاء"; sleep 14; xcrun simctl io "$UDID" screenshot shots/listen-dua-late.png >/dev/null 2>&1 || true
          shot tab-library-q -debugTab library; shot listen-kumail -debugListen "kumail"; sleep 14; xcrun simctl io "$UDID" screenshot shots/listen-kumail-late.png >/dev/null 2>&1 || true
          shot home-personal -debugTab home -personalOccasions '[{"id":"a1","name":"الوالد رحمه الله","kind":"death","month":5,"day":25,"year":1440,"remind":true,"daysBefore":1,"note":""},{"id":"a2","name":"ميلاد علي","kind":"birth","month":7,"day":13,"remind":true,"daysBefore":1,"note":""},{"id":"a3","name":"نذر زيارة","kind":"vow","month":9,"day":1,"remind":true,"daysBefore":3,"note":""}]'
          shot calendar-personal -debugTab calendar -personalOccasions '[{"id":"a1","name":"الوالد رحمه الله","kind":"death","month":5,"day":25,"year":1440,"remind":true,"daysBefore":1,"note":""},{"id":"a2","name":"ميلاد علي","kind":"birth","month":7,"day":13,"remind":true,"daysBefore":1,"note":""},{"id":"a3","name":"نذر زيارة","kind":"vow","month":9,"day":1,"remind":true,"daysBefore":3,"note":""}]'
          xcrun simctl ui "$UDID" appearance dark
          shot dark-home -debugTab home
          shot dark-tasbih -debugSheet tasbih
          shot dark-reader -debugReader mashhura/m-kumayl
          # iPad
          IPAD=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[(k,x) for k,v in d.items() if 'iOS-26' in k for x in v if x['name'].startswith('iPad Pro')]; c.sort(key=lambda t:(t[0],t[1]['name'])); print(c[-1][1]['udid'] if c else '')")
          if [ -n "$IPAD" ]; then
            xcrun simctl ui "$UDID" appearance light
            UDID=$IPAD
            xcrun simctl boot "$UDID" || true; xcrun simctl bootstatus "$UDID" -b
            xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
            xcrun simctl install "$UDID" "$APP"
            shot ipad-home -debugTab home -personalOccasions '[{"id":"a1","name":"الوالد رحمه الله","kind":"death","month":5,"day":25,"year":1440,"remind":true,"daysBefore":1,"note":""},{"id":"a2","name":"ميلاد علي","kind":"birth","month":7,"day":13,"remind":true,"daysBefore":1,"note":""},{"id":"a3","name":"نذر زيارة","kind":"vow","month":9,"day":1,"remind":true,"daysBefore":3,"note":""}]'
            shot ipad-library -debugTab library
            shot ipad-more -debugTab more
            shot ipad-reader -debugReader mashhura/m-kumayl
            shot ipad-calendar -debugTab calendar
            xcrun simctl ui "$UDID" appearance light || true
          fi
          ls shots | wc -l
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i rafiq || echo "no crash reports"
          for f in ~/Library/Logs/DiagnosticReports/RafiqAlMumin*; do [ -f "$f" ] && head -60 "$f"; done || true

      - name: Publish simulator screenshots to apk-out (ios-screens/)
        run: |
          rm -rf out3 && git clone -q --depth 1 -b apk-out "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" out3
          rm -rf out3/ios-screens && mkdir -p out3/ios-screens && cp android/ios/shots/*.png out3/ios-screens/ && cd out3
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A ios-screens && git commit -q -m "iOS screenshots ${GITHUB_SHA::7}" && for i in 1 2 3; do git pull -q --rebase origin apk-out; git push -q origin apk-out && break; sleep 5; done

      - name: Publish compiler errors to apk-out (ios-errors.txt)
        if: failure()
        run: |
          grep -E "error:" android/ios/xcodebuild.log | sort -u > /tmp/ios-errors.txt || true
          git clone -q --depth 1 -b apk-out "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" out2
          cp /tmp/ios-errors.txt out2/ios-errors.txt && cd out2
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add ios-errors.txt && git commit -q -m "iOS errors ${GITHUB_SHA::7}" && for i in 1 2 3; do git pull -q --rebase origin apk-out; git push -q origin apk-out && break; sleep 5; done
