# Builds an unsigned iPhone .ipa from the same zip, for sideloading with Sideloadly (it signs with your Apple ID).
# The .ipa is pushed to the apk-out branch as RafiqAlMumin.ipa.
name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    paths: ['**.zip']

jobs:
  ipa:
    runs-on: macos-26   # Xcode 26 / iOS 26 SDK: required for Liquid Glass
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q "$(ls *.zip | head -1)"

      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode_26*.app || true
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1); sudo xcode-select -s "$X/Contents/Developer"; xcodebuild -version

      - name: Generate the Xcode project
        working-directory: android/ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        working-directory: android/ios
        run: |
          set -o pipefail
          xcodebuild -project RafiqAlMumin.xcodeproj -scheme RafiqAlMumin -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee xcodebuild.log | grep -E "error:|warning: unre|BUILD" | head -150

      - name: Package .ipa
        working-directory: android/ios
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP" || { echo "::error::No .app produced"; exit 1; }
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry RafiqAlMumin.ipa Payload && ls -la RafiqAlMumin.ipa

      - name: Publish .ipa to apk-out
        run: |
          git clone -q --depth 1 -b apk-out "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" out || { mkdir out && cd out && git init -q -b apk-out && cd ..; }
          cp android/ios/RafiqAlMumin.ipa out/
          cd out && git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add RafiqAlMumin.ipa && git commit -q -m "iOS ipa ${GITHUB_SHA::7}"
          for i in 1 2 3; do git pull -q --rebase origin apk-out; git push -q origin apk-out && break; sleep 8; done

      - name: Publish compiler errors to apk-out (ios-errors.txt)
        if: failure()
        run: |
          grep -E "error:" android/ios/xcodebuild.log | sort -u > /tmp/ios-errors.txt || true
          git clone -q --depth 1 -b apk-out "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" out2
          cp /tmp/ios-errors.txt out2/ios-errors.txt && cd out2
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add ios-errors.txt && git commit -q -m "iOS errors ${GITHUB_SHA::7}" && for i in 1 2 3; do git pull -q --rebase origin apk-out; git push -q origin apk-out && break; sleep 5; done
